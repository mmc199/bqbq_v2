<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>购物车面板 手机端适配验证</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#475569;
         display:flex; gap:14px; padding:14px; align-items:flex-start; }
  .phone {
    position:relative; background:#f8fafc; overflow:hidden;
    border-radius:6px; height:560px;
  }
  .label {
    position:absolute; top:0; left:0; right:0; font-size:10px; color:#334155;
    background:#e2e8f0; padding:2px 5px; z-index:99; font-weight:600;
  }
  /* FAB 网格：right-4(16px), 两列 56px + gap 12px = 140px */
  .fabs {
    position:absolute; right:16px; top:112px;
    display:grid; grid-template-columns:56px 56px; gap:12px;
  }
  .fab {
    width:56px; height:56px; border-radius:16px; background:#fff;
    border:1px solid #e2e8f0; box-shadow:0 4px 6px -1px rgb(0 0 0/.1);
    display:flex; align-items:center; justify-content:center; font-size:9px; color:#64748b;
  }
  .fab.amber{border-color:#fde68a;color:#d97706}
  .fab.cyan{border-color:#a5f3fc;color:#0891b2}

  /* 面板：right-4 (16px), w-[calc(100vw-2rem)], max-w-72 */
  .panel {
    position:absolute; top:96px; right:16px;
    background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:12px;
    box-shadow:0 25px 50px -12px rgb(0 0 0/.25);
    display:flex; flex-direction:column; gap:8px; max-width:288px;
  }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .cell { position:relative; }
  .thumb { width:100%; aspect-ratio:1; border-radius:4px; border:1px solid #e2e8f0; display:block; }
  .rm {
    position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:9999px;
    background:#ef4444; color:#fff; font-size:10px; line-height:1; border:none;
    display:flex; align-items:center; justify-content:center; outline:1px solid #fff; padding:0;
  }
  .hint { font-size:11px; color:#64748b; }
  .btn { padding:4px 8px; font-size:12px; border:none; border-radius:4px; }
  .b1 { background:#f59e0b; color:#fff; } .b2 { background:#e2e8f0; color:#334155; }
  .title { font-size:12px; font-weight:700; color:#475569; }
  .ok { outline:3px solid #22c55e; outline-offset:2px; }
</style>
</head>
<body>

<div class="phone" style="width:360px">
  <span class="label">360px · iPhone SE / 多数安卓</span>
  <div class="fabs">
    <div class="fab amber">购物车</div><div class="fab cyan">登录</div>
    <div class="fab">标签数</div><div class="fab">打标</div>
    <div class="fab">排序</div><div class="fab">HQ</div>
  </div>
  <div class="panel ok" style="width:calc(100vw - 2rem); max-width:288px">
    <div class="title">购物车（4）</div>
    <div class="grid">
      <div class="cell"><img class="thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect fill='%23fbbf24' width='40' height='40'/></svg>"><button class="rm">&times;</button></div>
      <div class="cell"><img class="thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect fill='%2334d399' width='40' height='40'/></svg>"><button class="rm">&times;</button></div>
      <div class="cell"><img class="thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect fill='%2360a5fa' width='40' height='40'/></svg>"><button class="rm">&times;</button></div>
      <div class="cell"><img class="thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect fill='%23f472b6' width='40' height='40'/></svg>"><button class="rm">&times;</button></div>
    </div>
    <div class="hint">点按钮后私聊机器人发送 bqbq取回</div>
    <button class="btn b1">发送到 QQ（4 张）</button>
    <button class="btn b2">清空</button>
  </div>
</div>

</html>
