<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>底端总数徽标</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 30px; background:#f8fafc; }
  h2 { font-size: 14px; color:#334155; margin: 24px 0 12px; }
  .row { display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap; }
  .item { text-align:center; }
  .lbl { font-size:11px; color:#94a3b8; margin-top:14px; }
  .fab {
    width:56px; height:56px; border-radius:16px; background:#fff;
    border:1px solid #a5f3fc; color:#0891b2;
    box-shadow:0 10px 15px -3px rgb(0 0 0/.1);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .fab.active { background:#cffafe; border-color:#67e8f9; }
  .total-badge {
    position:absolute;
    bottom:-6px; left:50%; transform:translateX(-50%);
    height:14px; min-width:32px;
    display:flex; align-items:center; justify-content:center;
    background:#334155; color:#fff; font-size:9px; font-weight:700;
    padding:0 4px; border-radius:9999px; white-space:nowrap;
    line-height:1; box-shadow:0 1px 2px rgb(0 0 0/.1);
  }
  .range-badge {
    position:absolute; top:-4px; right:-4px;
    background:#06b6d4; color:#fff; font-size:9px; font-weight:700;
    padding:2px 6px; border-radius:9999px; line-height:1.2; white-space:nowrap;
  }
  .plain {
    width:56px; height:56px; border-radius:16px; background:#fff;
    border:1px solid #e2e8f0;
  }
</style>
</head>
<body>

<h2>fab-tag-count：底端显示完整总数</h2>
<div class="row">

  <div class="item">
    <div class="fab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
      <span class="total-badge">128</span>
    </div>
    <div class="lbl">128</div>
  </div>

  <div class="item">
    <div class="fab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
      <span class="total-badge">12345</span>
      <span class="range-badge">2-5</span>
    </div>
    <div class="lbl">12345 + 筛选 2-5</div>
  </div>

  <div class="item">
    <div class="fab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
      <span class="total-badge">458441</span>
    </div>
    <div class="lbl">458441（全库）</div>
  </div>

  <div class="item">
    <div class="fab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
    </div>
    <div class="lbl">0 / 未搜索（不显示）</div>
  </div>

  <div class="item">
    <div class="fab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
      <span class="total-badge">458441</span>
      <span class="range-badge">0-∞</span>
    </div>
    <div class="lbl">458441 + 0-∞（最长组合）</div>
  </div>

</div>

<h2>与相邻按钮的间距（网格 gap-3 = 12px）</h2>
<div style="display:grid; grid-template-columns:56px 56px; gap:12px; width:124px; margin-bottom:8px;">
  <div class="fab" style="display:flex;align-items:center;justify-content:center;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
    <span class="total-badge">12345</span>
  </div>
  <div class="plain"></div>
  <div class="plain"></div>
  <div class="plain"></div>
</div>
<div class="lbl" style="text-align:left">凸出 6px，间距 12px，不会碰到下一行</div>

</body>
</html>
