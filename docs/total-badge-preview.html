<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>总数徽标效果</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 24px; background:#f8fafc; }
  h2 { font-size: 14px; color:#334155; margin: 20px 0 10px; }
  .row { display:flex; gap:24px; align-items:flex-start; }
  .item { text-align:center; }
  .lbl { font-size:11px; color:#94a3b8; margin-top:6px; }
  .fab {
    width:56px; height:56px; border-radius:16px; background:#fff;
    border:1px solid #a5f3fc; color:#0891b2;
    box-shadow:0 10px 15px -3px rgb(0 0 0/.1);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .fab.active { background:#cffafe; border-color:#67e8f9; }
  .badge {
    position:absolute; top:-4px; color:#fff; font-size:9px; font-weight:700;
    padding:2px 6px; border-radius:9999px; line-height:1.2; white-space:nowrap;
  }
  .badge-total { left:-4px; background:#334155; }
  .badge-range { right:-4px; background:#06b6d4; }
</style>
</head>
<body>

<h2>fab-tag-count：左上=总数（深灰），右上=筛选范围（青）</h2>
<div class="row">

  <div class="item">
    <div class="fab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total">128</span>
    </div>
    <div class="lbl">只有总数</div>
  </div>

  <div class="item">
    <div class="fab active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total">1.2万</span>
      <span class="badge badge-range">2-5</span>
    </div>
    <div class="lbl">总数 + 筛选范围</div>
  </div>

  <div class="item">
    <div class="fab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total">45.8万</span>
    </div>
    <div class="lbl">全库 45.8 万</div>
  </div>

  <div class="item">
    <div class="fab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total" style="display:none">0</span>
    </div>
    <div class="lbl">0 / 未搜索（不显示）</div>
  </div>

  <div class="item">
    <div class="fab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total">9999</span>
    </div>
    <div class="lbl">9999（阈值上限）</div>
  </div>

</div>


<h2 style="margin-top:28px">压力测试：最长的数字组合</h2>
<div class="row">
  <div class="item">
    <div class="fab active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total">45.8万</span>
      <span class="badge badge-range">0-∞</span>
    </div>
    <div class="lbl">45.8万 + 0-∞</div>
  </div>
  <div class="item">
    <div class="fab active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total">123万</span>
      <span class="badge badge-range">2-5</span>
    </div>
    <div class="lbl">123万 + 2-5</div>
  </div>
  <div class="item">
    <div class="fab active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
      <span class="badge badge-total">128</span>
      <span class="badge badge-range">2-5</span>
    </div>
    <div class="lbl">128 + 2-5（常见）</div>
  </div>
</div>
</body>
</html>
