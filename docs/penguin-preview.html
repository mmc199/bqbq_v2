<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>QQ 风格企鹅 v4</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 24px; background: #f8fafc; }
  h2 { font-size: 15px; color: #334155; margin: 22px 0 10px; }
  .row { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; }
  /* 模拟 FAB（与 FloatingButtons.vue 完全一致的尺寸与圆角） */
  .fab {
    width: 56px; height: 56px; border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; position: relative; border-width: 1px; border-style: solid;
  }
  /* 仿 fab-import 的 indigo 风格：白底 + 彩边 */
  .fab-idle { background:#fff; border-color:#e2e8f0; color:#94a3b8; }
  /* 已登录：QQ 蓝（仿 fab-upload 的实心风格） */
  .fab-on   { background:#12B7F5; border-color:#0FA3DC; color:#fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; }
  .dot-off{background:#cbd5e1} .dot-on{background:#fff}
  .s128{width:128px;height:128px} .s64{width:64px;height:64px}
  .s40{width:40px;height:40px} .s24{width:24px;height:24px}
  .note{font-size:12px;color:#64748b;margin-top:6px;text-align:center}
  .oncard{background:#1e293b;padding:12px;border-radius:8px;color:#fff;display:inline-flex;gap:8px;margin-top:8px}
  .tile{padding:8px;border-radius:8px;display:inline-flex;background:rgba(0,0,0,.4)}
  .label{font-size:11px;color:#94a3b8;margin-top:4px;text-align:center}
</style>
</head>
<body>

<h2>QQ 官方风格：天蓝身体 + 白肚 + 黑眼 + 橙喙</h2>
<div class="panel">
<div class="row">

  <!-- 128px 大图 -->
  <div style="text-align:center">
    <svg class="s128" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <!-- 身体：QQ 天蓝 -->
      <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63
               -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28
               .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76
               c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28
               0-2.04-.96-3.92-2.44-5.24.42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z"
            fill="#12B7F5"/>
      <!-- 白色腹部 -->
      <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43
               s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#fff"/>
      <!-- 眼白 -->
      <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
      <!-- 瞳孔 -->
      <circle cx="10.55" cy="6.62" r="0.65" fill="#111"/>
      <circle cx="13.45" cy="6.62" r="0.65" fill="#111"/>
      <!-- 橙色喙 -->
      <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#FFA630"/>
    </svg>
    <div class="note">128px · 完整细节</div>
  </div>

  <div style="text-align:center">
    <svg class="s64" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63 -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28 .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76 c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28 0-2.04-.96-3.92-2.44-5.24 .42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z" fill="#12B7F5"/>
      <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43 s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#fff"/>
      <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="10.55" cy="6.62" r="0.65" fill="#111"/>
      <circle cx="13.45" cy="6.62" r="0.65" fill="#111"/>
      <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#FFA630"/>
    </svg>
    <div class="note">64px</div>
  </div>

  <div style="text-align:center">
    <svg class="s40" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63 -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28 .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76 c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28 0-2.04-.96-3.92-2.44-5.24 .42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z" fill="#12B7F5"/>
      <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43 s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#fff"/>
      <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="10.55" cy="6.62" r="0.65" fill="#111"/>
      <circle cx="13.45" cy="6.62" r="0.65" fill="#111"/>
      <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#FFA630"/>
    </svg>
    <div class="note">40px</div>
  </div>

  <!-- FAB 未登录 -->
  <div style="text-align:center">
    <div class="fab fab-idle">
      <svg class="s24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63 -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28 .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76 c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28 0-2.04-.96-3.92-2.44-5.24 .42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z" fill="#cbd5e1"/>
        <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43 s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#fff"/>
        <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
        <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
        <circle cx="10.55" cy="6.62" r="0.65" fill="#94a3b8"/>
        <circle cx="13.45" cy="6.62" r="0.65" fill="#94a3b8"/>
        <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#cbd5e1"/>
      </svg>
      <div class="dot dot-off"></div>
    </div>
    <div class="label">未登录</div>
  </div>

  <!-- FAB 已登录 -->
  <div style="text-align:center">
    <div class="fab fab-on">
      <svg class="s24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63 -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28 .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76 c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28 0-2.04-.96-3.92-2.44-5.24 .42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z" fill="#fff"/>
        <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43 s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#12B7F5"/>
        <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
        <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
        <circle cx="10.55" cy="6.62" r="0.65" fill="#111"/>
        <circle cx="13.45" cy="6.62" r="0.65" fill="#111"/>
        <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#FFA630"/>
      </svg>
      <div class="dot dot-on"></div>
    </div>
    <div class="label">已登录（反色）</div>
  </div>

</div>

<h2>卡片深色工具条上（购物车按钮位置）</h2>
<div class="oncard">
  <span class="tile">
    <svg class="s24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63 -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28 .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76 c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28 0-2.04-.96-3.92-2.44-5.24 .42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z" fill="#12B7F5"/>
      <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43 s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#fff"/>
      <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="10.55" cy="6.62" r="0.65" fill="#111"/>
      <circle cx="13.45" cy="6.62" r="0.65" fill="#111"/>
      <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#FFA630"/>
    </svg>
  </span>
  <span class="tile">📋</span>
  <span class="tile">🗑</span>
</div>


<h2>与其它 FAB 按钮并排（看整体协调度）</h2>
<div class="panel">
<div class="row" style="gap:12px">
  <!-- export: amber -->
  <div class="fab" style="background:#fff;border-color:#fde68a;color:#d97706">
    <svg class="s24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
  </div>
  <!-- login idle -->
  <div class="fab fab-idle">
    <svg class="s24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63 -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28 .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76 c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28 0-2.04-.96-3.92-2.44-5.24 .42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z" fill="#cbd5e1"/>
      <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43 s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#fff"/>
      <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="10.55" cy="6.62" r="0.65" fill="#94a3b8"/>
      <circle cx="13.45" cy="6.62" r="0.65" fill="#94a3b8"/>
      <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#cbd5e1"/>
    </svg>
    <div class="dot dot-off"></div>
  </div>
  <!-- login on -->
  <div class="fab fab-on">
    <svg class="s24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1.6c-2.4 0-4.3 2.25-4.3 5.5 0 1.35.24 2.62.66 3.63 -1.48 1.32-2.44 3.2-2.44 5.24 0 2.2.74 3.66 1.99 4.28 .73.36 1.58.39 2.32.12.7.51 1.5.76 2.25.76s1.55-.25 2.25-.76 c.74.27 1.59.24 2.32-.12 1.25-.62 1.99-2.08 1.99-4.28 0-2.04-.96-3.92-2.44-5.24 .42-1.01.66-2.28.66-3.63 0-3.25-1.9-5.5-4.3-5.5z" fill="#fff"/>
      <path d="M12 10.5c-1.8 0-3.12 1.68-3.12 3.92 0 2.55 1.33 4.43 3.12 4.43 s3.12-1.88 3.12-4.43c0-2.24-1.32-3.92-3.12-3.92z" fill="#12B7F5"/>
      <circle cx="10.45" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="13.55" cy="6.5" r="1.2" fill="#fff"/>
      <circle cx="10.55" cy="6.62" r="0.65" fill="#111"/>
      <circle cx="13.45" cy="6.62" r="0.65" fill="#111"/>
      <path d="M12 8.25l1.32 1.2L12 10.4l-1.32-.95z" fill="#FFA630"/>
    </svg>
    <div class="dot dot-on"></div>
  </div>
  <!-- tag-count: cyan -->
  <div class="fab" style="background:#fff;border-color:#a5f3fc;color:#0891b2">
    <svg class="s24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>
    </svg>
  </div>
  <!-- upload: emerald solid -->
  <div class="fab" style="background:#10b981;border-color:#10b981;color:#fff">
    <svg class="s24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
    </svg>
  </div>
  <!-- search: blue solid -->
  <div class="fab" style="background:#2563eb;border-color:#2563eb;color:#fff">
    <svg class="s24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
  </div>
</div>
<div class="note" style="text-align:left;margin-top:10px">
  顺序：导出(amber) · 登录未登录 · 登录已登录 · 标签数(cyan) · 上传(emerald实心) · 搜索(blue实心)
</div>
</div>

</body>
</html>
